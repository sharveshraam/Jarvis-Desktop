name: JARVIS Windows build

on:
  push:
    branches: [feature/jarvis-desktop]
  pull_request:
    branches: [feature/jarvis-desktop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Jarvis.sln
      - name: Build
        run: dotnet build Jarvis.sln -c Release --no-restore
      - name: Test
        run: dotnet test Jarvis.sln -c Release --no-build --logger "trx;LogFileName=jarvis-tests.trx"
      - name: Publish self-contained app
        run: dotnet publish src/Jarvis.Desktop/Jarvis.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/publish
      - name: Package portable ZIP
        run: Compress-Archive -Path artifacts/publish/* -DestinationPath artifacts/JARVIS-win-x64.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-win-x64
          path: artifacts/JARVIS-win-x64.zip
